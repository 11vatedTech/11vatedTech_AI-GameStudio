name: Studio Core CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout source (pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python (pinned)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Compile source
        run: python -m compileall -q src tools tests

      - name: Run complete test suite
        run: python -m pytest -q

      - name: Smoke test installed command interfaces
        env:
          AGS_WORKSPACE: ${{ runner.temp }}/ags-workspace
        run: |
          ags --version
          ags init
          ags doctor
          ags capabilities
          ags skills search "character identity animation"
          ags jam profiles
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' | ags-mcp
          ags readiness

      - name: Smoke test creative MCP server over stdio
        env:
          AGS_WORKSPACE: ${{ github.workspace }}
        run: |
          python - <<'PY' > creative-mcp.in
          import json
          requests = [
              {"jsonrpc": "2.0", "id": 1, "method": "initialize", "params": {"protocolVersion": "2025-06-18", "capabilities": {}, "clientInfo": {"name": "ci", "version": "0"}}},
              {"jsonrpc": "2.0", "id": 2, "method": "tools/list", "params": {}},
              {"jsonrpc": "2.0", "id": 3, "method": "tools/call", "params": {"name": "ags_validate_animation_sequence", "arguments": {"manifest_path": "examples/animation/torch_sweep.sequence.example.json"}}},
              {"jsonrpc": "2.0", "id": 4, "method": "tools/call", "params": {"name": "ags_validate_animation_sequence", "arguments": {"manifest_path": "../outside.json"}}},
          ]
          print(chr(10).join(json.dumps(request) for request in requests))
          PY
          python tools/creative_mcp_server.py < creative-mcp.in > creative-mcp.out
          python - <<'PY'
          import json
          rows = [json.loads(line) for line in open("creative-mcp.out", encoding="utf-8")]
          assert rows[0]["result"]["protocolVersion"] == "2025-06-18", rows[0]
          assert len(rows[1]["result"]["tools"]) == 6, rows[1]
          assert rows[2]["result"]["isError"] is False, rows[2]
          assert rows[2]["result"]["structuredContent"]["valid"] is True, rows[2]
          assert rows[3]["result"]["isError"] is True, rows[3]
          assert rows[3]["result"]["structuredContent"]["code"] == "path_outside_workspace", rows[3]
          print("creative MCP stdio smoke passed")
          PY

      - name: Build distributable wheel
        run: python -m pip wheel --no-deps . --wheel-dir dist

      - name: Check repository package files
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          wheel = next(Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
              assert any(name.endswith("/cli.py") for name in names)
              assert sum("/data/skills/" in name and name.endswith("/SKILL.md") for name in names) >= 75
              assert sum("/data/schemas/" in name and name.endswith(".schema.json") for name in names) >= 20
          print(f"Validated wheel package data: {wheel.name}")
          PY
